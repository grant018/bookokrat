[package]
name = "bookokrat-reader"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
description = "Desktop reader built on the bookokrat core"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
bookokrat = { path = "../..", default-features = false, features = ["pdf"] }
ratatui = { version = "0.30.0", default-features = false }
mupdf = { version = "0.6.0", default-features = false, features = ["svg", "system-fonts", "img"] }
rdjvu = { package = "djvu", version = "0.1.0" }
flume = "0.12"
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
epub = "2.1.5"
base64 = "0.22"
roxmltree = "0.20"
crossterm = "0.29.0"
open = "5.3"
serde_yaml = "0.9"
toml = "0.9"
chrono = "0.4"
fontdb = "0.24"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
simplelog = "0.12.1"
log = "0.4"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
gdk = "0.18"
glib = "0.18"
webkit2gtk = "2.0"

[profile.release]
opt-level = 3
lto = "thin"
strip = true
